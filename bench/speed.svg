<svg viewBox="0 0 800 432" width="800" height="432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="speed-title speed-desc">
  <title id="speed-title">Decode speed: Ollama vs mlx-vlm with drafters</title>
  <desc id="speed-desc">Mean decode tokens per second with thinking off, per model: Ollama, mlx-vlm without a drafter, and mlx-vlm with its fastest drafter and the speed-up it gives.</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="40" y="32" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">DECODE SPEED · THINKING OFF · HIGHER IS BETTER</text>
  <line x1="180" y1="48" x2="180" y2="336" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <text x="180" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0</text>
  <line x1="310" y1="48" x2="310" y2="336" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="310" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">20</text>
  <line x1="440" y1="48" x2="440" y2="336" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="440" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">40</text>
  <line x1="570" y1="48" x2="570" y2="336" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="570" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">60</text>
  <line x1="700" y1="48" x2="700" y2="336" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="700" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">80</text>
  <text x="440" y="368" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="middle">TOKENS / SECOND</text>
  <text x="40" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">qwen3.8-27b</text>
  <text x="168" y="88" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="end">Ollama</text>
  <rect x="180" y="76" width="153" height="16" fill="#f5f5f5"/>
  <rect x="180" y="76" width="153" height="16" fill="rgba(124,143,111,0.18)" stroke="#7c8f6f" stroke-width="1"/>
  <text x="341" y="87" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">23.5</text>
  <text x="168" y="112" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="end">mlx-vlm</text>
  <rect x="180" y="100" width="57" height="16" fill="#f5f5f5"/>
  <rect x="180" y="100" width="57" height="16" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="245" y="111" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">8.7</text>
  <text x="168" y="136" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="end">+ DFlash2</text>
  <rect x="180" y="124" width="121" height="16" fill="#f5f5f5"/>
  <rect x="180" y="124" width="121" height="16" fill="rgba(191,69,32,0.12)" stroke="#bf4520" stroke-width="1"/>
  <text x="309" y="135" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">18.7<tspan fill="#bf4520" font-weight="600" dx="8">2.1×</tspan></text>
  <text x="40" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">qwen3.5-9b</text>
  <text x="168" y="192" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="end">Ollama</text>
  <rect x="180" y="180" width="138" height="16" fill="#f5f5f5"/>
  <rect x="180" y="180" width="138" height="16" fill="rgba(124,143,111,0.18)" stroke="#7c8f6f" stroke-width="1"/>
  <text x="326" y="191" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">21.2</text>
  <text x="168" y="216" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="end">mlx-vlm</text>
  <rect x="180" y="204" width="164" height="16" fill="#f5f5f5"/>
  <rect x="180" y="204" width="164" height="16" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="352" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">25.3</text>
  <text x="168" y="240" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="end">+ DFlash</text>
  <rect x="180" y="228" width="314" height="16" fill="#f5f5f5"/>
  <rect x="180" y="228" width="314" height="16" fill="rgba(191,69,32,0.12)" stroke="#bf4520" stroke-width="1"/>
  <text x="502" y="239" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">48.3<tspan fill="#bf4520" font-weight="600" dx="8">1.9×</tspan></text>
  <text x="40" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">lfm2.5-2.6b</text>
  <text x="168" y="296" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="end">mlx-vlm</text>
  <rect x="180" y="284" width="153" height="16" fill="#f5f5f5"/>
  <rect x="180" y="284" width="153" height="16" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="341" y="295" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">23.5</text>
  <text x="168" y="320" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist', system-ui, sans-serif" text-anchor="end">+ DSpark</text>
  <rect x="180" y="308" width="367" height="16" fill="#f5f5f5"/>
  <rect x="180" y="308" width="367" height="16" fill="rgba(191,69,32,0.12)" stroke="#bf4520" stroke-width="1"/>
  <text x="555" y="319" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">56.4<tspan fill="#bf4520" font-weight="600" dx="8">2.4×</tspan></text>
  <line x1="40" y1="384" x2="760" y2="384" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/>
  <rect x="40" y="400" width="16" height="10" rx="2" fill="rgba(124,143,111,0.18)" stroke="#7c8f6f" stroke-width="1"/>
  <text x="64" y="409" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">Ollama</text>
  <rect x="136" y="400" width="16" height="10" rx="2" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <text x="160" y="409" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">mlx-vlm, no drafter</text>
  <rect x="276" y="400" width="16" height="10" rx="2" fill="rgba(191,69,32,0.12)" stroke="#bf4520" stroke-width="1"/>
  <text x="300" y="409" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">mlx-vlm + fastest drafter (× vs no drafter)</text>
  <text x="760" y="409" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">Apple M3 Pro 36 GB · mean of 3–9 runs</text>
</svg>
